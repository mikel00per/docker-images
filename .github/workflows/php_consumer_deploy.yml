name: Deploy PHP Containers

on:
  push:
    branches: [ dev ]
    paths:
      - 'php-consumer/**'

jobs:
  php-consumer-development-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Config environment to build image php
        run: ./configure.sh

      - name: Build image php
        run: make build-php-consumer-development

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Push image php
        run: make push-php-consumer-development

  php-consumer-production-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Config environment to build image php
        run: ./configure.sh

      - name: Build image php
        run: make build-php-consumer-production

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Push image php
        run: make push-php-consumer-production
