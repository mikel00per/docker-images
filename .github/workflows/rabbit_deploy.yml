name: Deploy RabbitMq Containers

on:
  push:
    branches: [ dev ]
    paths:
      - 'rabbitmq/**'

jobs:
  rabbitmq-development-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Config environment to build image rabbitmq
        run: ./configure.sh

      - name: Build image rabbitmq
        run: make build-rabbitmq-development

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Push image rabbitmq
        run: make push-rabbitmq-development

  rabbitmq-production-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Config environment to build image rabbitmq
        run: ./configure.sh

      - name: Build image rabbitmq
        run: make build-rabbitmq-production

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Push image rabbitmq
        run: make push-rabbitmq-production
