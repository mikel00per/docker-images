version: "3.9"

services:

  rabbitmq-development:
    hostname: ${RABBITMQ_NAME}
    container_name: ${RABBITMQ_NAME}
    image: mikel00per/${RABBITMQ_NAME}
    build:
      context: ${RABBITMQ_CONTEXT}
      args:
        UID: ${UID}
        GID: ${GID}
        UNAME: ${UNAME}
        GNAME: ${GNAME}
        RABBITMQ_NAME: ${RABBITMQ_NAME}
        RABBITMQ_CONTEXT: ${RABBITMQ_CONTEXT}
        RABBITMQ_VERSION: ${RABBITMQ_VERSION}
        RABBITMQ_PORT: ${RABBITMQ_PORT}
        RABBITMQ_PANEL_PORT: ${RABBITMQ_PANEL_PORT}
        RABBITMQ_CONFIG_SOURCE: ${RABBITMQ_CONFIG_SOURCE}
        RABBITMQ_CONFIG_TARGET: ${RABBITMQ_CONFIG_TARGET}
        RABBITMQ_HEALTHCHECK_SOURCE: ${RABBITMQ_HEALTHCHECK_SOURCE}
        RABBITMQ_HEALTHCHECK_TARGET: ${RABBITMQ_HEALTHCHECK_TARGET}
    ports:
      - ${RABBITMQ_PORT}:${RABBITMQ_PORT}
      - ${RABBITMQ_PANEL_PORT}:${RABBITMQ_PANEL_PORT}
    networks:
      - default
    healthcheck:
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
      test: ['CMD', 'docker-healthcheck']

  rabbitmq-production:
    hostname: ${RABBITMQ_NAME}
    container_name: ${RABBITMQ_NAME}
    image: mikel00per/${RABBITMQ_NAME}
    build:
      context: ${RABBITMQ_CONTEXT}
      args:
        UID: ${UID}
        GID: ${GID}
        UNAME: ${UNAME}
        GNAME: ${GNAME}
        RABBITMQ_NAME: ${RABBITMQ_NAME}
        RABBITMQ_CONTEXT: ${RABBITMQ_CONTEXT}
        RABBITMQ_VERSION: ${RABBITMQ_VERSION}
        RABBITMQ_PANEL_PORT: ${RABBITMQ_PANEL_PORT}
        RABBITMQ_CONFIG_SOURCE: ${RABBITMQ_CONFIG_SOURCE}
        RABBITMQ_CONFIG_TARGET: ${RABBITMQ_CONFIG_TARGET}
        RABBITMQ_HEALTHCHECK_SOURCE: ${RABBITMQ_HEALTHCHECK_SOURCE}
        RABBITMQ_HEALTHCHECK_TARGET: ${RABBITMQ_HEALTHCHECK_TARGET}
    ports:
      - ${RABBITMQ_PORT}:${RABBITMQ_PORT}
      - ${RABBITMQ_PANEL_PORT}:${RABBITMQ_PANEL_PORT}
    networks:
      - default
    healthcheck:
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
      test: ['CMD', 'docker-healthcheck']

networks:
  default:
    name: backend
    driver: bridge
